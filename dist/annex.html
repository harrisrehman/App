    </div>
    <script>
      window.__annexBootstrap = 1;
      (function () {
        if (window.__annexMediaPatched) return;
        window.__annexMediaPatched = true;
        window.__annexThemePlayers = window.__annexThemePlayers || [];
        var NativeAudio = window.Audio;
        window.Audio = function () {
          var el = new NativeAudio(arguments[0], arguments[1]);
          window.__annexThemePlayers.push(el);
          return el;
        };
        window.Audio.prototype = NativeAudio.prototype;
        window.__annexStopAllMedia = function () {
          for (var i = 0; i < window.__annexThemePlayers.length; i++) {
            var el = window.__annexThemePlayers[i];
            if (!el) continue;
            try {
              el.pause();
              el.removeAttribute("src");
              el.load();
            } catch (e) {}
          }
          window.__annexThemePlayers = [];
        };
      })();
    </script>
