  <body class="menu">
    <canvas id="game"></canvas>
    <div id="menu">
      <div class="menu-veil" aria-hidden="true"></div>
      <div class="menu-stars" aria-hidden="true"></div>
      <div class="menu-frame">
        <div class="menu-mark" aria-hidden="true"></div>
        <p class="menu-kicker">Swords · Horses · Kingdoms</p>
        <h1>FATH</h1>
        <p class="menu-tag">Rise. Build. Conquer.</p>
        <p id="menu-ver">v0.5.53</p>
        <div id="menu-home">
          <button id="start-btn" type="button">Start</button>
        </div>
        <div id="menu-bots" class="hidden">
          <p>How many bots?</p>
          <div class="bot-picks">
            <button type="button" data-bots="1">1</button>
            <button type="button" data-bots="2">2</button>
            <button type="button" data-bots="3">3</button>
            <button type="button" data-bots="4">4</button>
          </div>
          <button id="menu-back" type="button">Back</button>
        </div>
        <div id="menu-diff" class="hidden">
          <p>Difficulty</p>
          <div class="bot-picks">
            <button type="button" data-diff="easy">Easy</button>
            <button type="button" data-diff="medium">Medium</button>
            <button type="button" data-diff="hard">Hard</button>
          </div>
          <button id="menu-diff-back" type="button">Back</button>
        </div>
      </div>
    </div>
    <div id="hud">
      <div class="top">
        <div class="brand">
          <span id="title">FATH</span>
          <span id="version">v0.5.53</span>
        </div>
        <div class="actions">
          <button id="wall-btn" type="button">Wall</button>
        </div>
      </div>
      <div id="toast"></div>
      <nav id="filters" class="side">
        <div class="filter-row">
          <button type="button" data-filter="all" class="filter-btn on" aria-label="All">All</button>
        </div>
        <div class="filter-row">
          <button type="button" data-filter="gunner" class="filter-btn filter-gunner" aria-label="Gunners">
            <span class="gunner-glyph" aria-hidden="true"><span class="gunner-body"></span><span class="gunner-barrel"></span></span>
          </button>
          <span class="filter-count" data-count="gunner">0</span>
        </div>
        <div class="filter-row">
          <button type="button" data-filter="troop" class="filter-btn" aria-label="Soldiers">
            <span class="soldier-dot" aria-hidden="true"></span>
          </button>
          <span class="filter-count" data-count="troop">0</span>
        </div>
      </nav>
      <nav id="shop" class="bottom">
        <button id="defense-btn" type="button" disabled>
          <span class="shop-name">Gunner</span>
          <span class="shop-cost">6</span>
        </button>
      </nav>
    </div>
    <div id="error" class="hidden">
      <div class="error-card">
        <h2>Can't wall there</h2>
        <p id="error-text">You can't make walls through enemy bases.</p>
        <button id="error-ok" type="button">OK</button>
      </div>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="result"></h1>
      <div class="end-actions">
        <button id="restart-btn" type="button">Again</button>
        <button id="menu-btn" type="button">Menu</button>
      </div>
    </div>
    <script>
      window.__annexBootstrap = 1;
      (function () {
        if (window.__annexMediaPatched) return;
        window.__annexMediaPatched = true;
        window.__annexThemePlayers = window.__annexThemePlayers || [];
        var NativeAudio = window.Audio;
        window.Audio = function () {
          var el = new NativeAudio(arguments[0], arguments[1]);
          window.__annexThemePlayers.push(el);
          return el;
        };
        window.Audio.prototype = NativeAudio.prototype;
        window.__annexStopAllMedia = function () {
          for (var i = 0; i < window.__annexThemePlayers.length; i++) {
            var el = window.__annexThemePlayers[i];
            if (!el) continue;
            try {
              el.pause();
              el.removeAttribute("src");
              el.load();
            } catch (e) {}
          }
          window.__annexThemePlayers = [];
        };
      })();
    </script>
  </body>
