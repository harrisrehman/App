  <body class="menu">
    <canvas id="game"></canvas>
    <div id="menu">
      <h1>ANNEX</h1>
      <p id="menu-ver">v0.5.35</p>
      <div id="menu-home">
        <button id="start-btn" type="button">Start</button>
        <button id="menu-update-btn" type="button">Update</button>
        <button id="menu-dev-btn" type="button">Dev</button>
      </div>
      <div id="menu-dev" class="hidden">
        <div class="dev-row">
          <span>Base health</span>
          <button type="button" data-rule="baseHealth" data-delta="-1">-</button>
          <span data-rule-value="baseHealth">10</span>
          <button type="button" data-rule="baseHealth" data-delta="1">+</button>
        </div>
        <div class="dev-row">
          <span>Soldier health</span>
          <button type="button" data-rule="soldierHealth" data-delta="-1">-</button>
          <span data-rule-value="soldierHealth">1</span>
          <button type="button" data-rule="soldierHealth" data-delta="1">+</button>
        </div>
      </div>
      <div id="menu-bots" class="hidden">
        <p>How many bots?</p>
        <div class="bot-picks">
          <button type="button" data-bots="1">1</button>
          <button type="button" data-bots="2">2</button>
          <button type="button" data-bots="3">3</button>
          <button type="button" data-bots="4">4</button>
        </div>
        <button id="menu-back" type="button">Back</button>
      </div>
    </div>
    <div id="hud">
      <div class="top">
        <div class="brand">
          <span id="title">ANNEX</span>
          <span id="version">v0.5.35</span>
        </div>
        <div class="actions">
          <button id="wall-btn" type="button">Wall</button>
          <button id="update-btn" type="button">Update</button>
        </div>
      </div>
      <div id="toast"></div>
      <div id="hint">Tap All, Gunners, or Soldiers. Then your base, then a target.</div>
      <nav id="filters" class="side">
        <button type="button" data-filter="all" class="on">All</button>
        <div class="filter-row">
          <button type="button" data-filter="gunner" class="filter-icon" aria-label="Gunners">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 15,7.5 15,16.5 7,20 3,12"/><rect x="14.5" y="10" width="8.2" height="4" rx="0.5"/></svg>
          </button>
          <button type="button" class="filter-count" data-count="gunner" tabindex="-1">0</button>
        </div>
        <div class="filter-row">
          <button type="button" data-filter="troop">Soldiers</button>
          <button type="button" class="filter-count" data-count="troop" tabindex="-1">0</button>
        </div>
      </nav>
      <nav id="shop" class="bottom">
        <button id="defense-btn" type="button" disabled>
          <span class="shop-name">Gunner</span>
          <span class="shop-cost">4</span>
        </button>
      </nav>
    </div>
    <div id="error" class="hidden">
      <div class="error-card">
        <h2>Can't wall there</h2>
        <p id="error-text">You can't make walls through enemy bases.</p>
        <button id="error-ok" type="button">OK</button>
      </div>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="result"></h1>
      <div class="end-actions">
        <button id="restart-btn" type="button">Again</button>
        <button id="menu-btn" type="button">Menu</button>
      </div>
    </div>
