name: Android APK

on:
  push:
    branches: [main, cursor/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: node scripts/sync-android-version.mjs
      - run: node scripts/verify-build-version.mjs
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: annex-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk annex.apk
      - name: Read version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Publish versioned APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Annex ${{ steps.meta.outputs.version }}
          prerelease: true
          make_latest: true
          files: annex.apk
          body: |
            **Version:** ${{ steps.meta.outputs.version }}

            **Download:** https://github.com/harrisrehman/App/releases/download/${{ steps.meta.outputs.tag }}/annex.apk

            Install this APK. Allow unknown sources if Android asks.
            Menu should show v${{ steps.meta.outputs.version }} after install.

            **Always-latest link:** https://github.com/harrisrehman/App/releases/download/latest/annex.apk
      - name: Publish always-latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FATH Latest
          prerelease: true
          make_latest: true
          files: annex.apk
          body: |
            This tag always points at the newest build.

            **Download:** https://github.com/harrisrehman/App/releases/download/latest/annex.apk
      - name: Update downloads/annex.apk on main
        if: github.ref == 'refs/heads/main'
        run: |
          cp annex.apk downloads/annex.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/annex.apk
          git diff --staged --quiet || git commit -m "Ship v${{ steps.meta.outputs.version }} APK to downloads."
          git push
