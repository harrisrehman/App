name: Android APK

on:
  push:
    branches: [main, cursor/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: annex-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk annex.apk
      - name: Publish downloadable APK
        if: github.ref == 'refs/heads/cursor/annex-android-a9d2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Annex APK
          prerelease: true
          files: annex.apk
          body: Debug APK for phone install. Allow unknown sources.
