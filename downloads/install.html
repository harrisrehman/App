<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120c08" />
    <title>Install Annex</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #120c08;
        color: #f4ead4;
        font-family: Palatino Linotype, Palatino, serif;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px 20px;
        text-align: center;
      }
      h1 {
        margin: 0;
        letter-spacing: 0.2em;
        font-size: 22px;
        color: #e8d48a;
      }
      p { color: #b5a27a; margin: 0; max-width: 280px; }
      a {
        display: inline-block;
        background: linear-gradient(180deg, #e0c36a, #b68a22);
        color: #1a100c;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border-radius: 4px;
        padding: 16px 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ANNEX</h1>
      <p>Uninstall old Annex first, then tap install. Look for v0.5.48.</p>
      <a href="./annex.apk" download="annex.apk">Install app</a>
    </main>
  </body>
</html>
