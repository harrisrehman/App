<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Annex</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; background: #0e0e10; color: #f2f2f4; font-family: sans-serif; }
      #version { display: block; font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <div class="brand">
          <span id="title">ANNEX</span>
          <span id="version">v0.4.3</span>
        </div>
        <span id="score">0 · 0</span>
        <button id="update-btn" type="button">Update</button>
      </div>
      <div id="toast"></div>
      <div id="hint">Drag your bases to select. Hold a target to send.</div>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="result"></h1>
      <button id="restart-btn" type="button">Again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
