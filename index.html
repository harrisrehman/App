<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Annex</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; background: #0e0e10; color: #f2f2f4; font-family: sans-serif; }
      #version { display: block; font-weight: 700; }
      body.menu #game, body.menu #hud { display: none !important; }
      #menu {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0e0e10; gap: 18px;
      }
    </style>
  </head>
  <body class="menu">
    <canvas id="game"></canvas>
    <div id="menu">
      <h1>ANNEX</h1>
      <p id="menu-ver">v0.5.12</p>
      <div id="menu-home">
        <button id="start-btn" type="button">Start</button>
        <button id="menu-update-btn" type="button">Update</button>
      </div>
      <div id="menu-bots" class="hidden">
        <p>How many bots?</p>
        <div class="bot-picks">
          <button type="button" data-bots="1">1</button>
          <button type="button" data-bots="2">2</button>
          <button type="button" data-bots="3">3</button>
          <button type="button" data-bots="4">4</button>
        </div>
        <button id="menu-back" type="button">Back</button>
      </div>
    </div>
    <div id="hud">
      <div class="top">
        <div class="brand">
          <span id="title">ANNEX</span>
          <span id="version">v0.5.12</span>
          <span id="score">0 · 0</span>
        </div>
        <div class="actions">
          <button id="wall-btn" type="button">Wall</button>
          <button id="update-btn" type="button">Update</button>
        </div>
      </div>
      <div id="toast"></div>
      <div id="hint">Circle soldiers or drag through them. End on a base to send.</div>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="result"></h1>
      <div class="end-actions">
        <button id="restart-btn" type="button">Again</button>
        <button id="menu-btn" type="button">Menu</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
