<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c9a56a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Annex</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; background: #c9a56a; color: #3b2416; font-family: Palatino Linotype, Palatino, serif; }
      #version { display: block; font-weight: 700; }
      body.menu #game, body.menu #hud { display: none !important; }
      #menu {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #c9a56a; gap: 18px;
      }
    </style>
  </head>
  <body class="menu">
    <canvas id="game"></canvas>
    <div id="menu">
      <div class="menu-veil" aria-hidden="true"></div>
      <div class="menu-stars" aria-hidden="true"></div>
      <div class="menu-frame">
        <div class="menu-mark" aria-hidden="true"></div>
        <p class="menu-kicker">Swords · Horses · Kingdoms</p>
        <h1>ANNEX</h1>
        <p class="menu-tag">Rise. Build. Conquer.</p>
        <p id="menu-ver">v0.5.47</p>
        <div id="menu-home">
          <button id="start-btn" type="button">Start</button>
          <button id="menu-update-btn" type="button">Update</button>
        </div>
        <div id="menu-bots" class="hidden">
          <p>How many bots?</p>
          <div class="bot-picks">
            <button type="button" data-bots="1">1</button>
            <button type="button" data-bots="2">2</button>
            <button type="button" data-bots="3">3</button>
            <button type="button" data-bots="4">4</button>
          </div>
          <button id="menu-back" type="button">Back</button>
        </div>
        <div id="menu-diff" class="hidden">
          <p>Difficulty</p>
          <div class="bot-picks">
            <button type="button" data-diff="easy">Easy</button>
            <button type="button" data-diff="medium">Medium</button>
            <button type="button" data-diff="hard">Hard</button>
          </div>
          <button id="menu-diff-back" type="button">Back</button>
        </div>
      </div>
      <button id="menu-mute" type="button">Sound on</button>
    </div>
    <div id="hud">
      <div class="top">
        <div class="brand">
          <span id="title">ANNEX</span>
          <span id="version">v0.5.47</span>
        </div>
        <div class="actions">
          <button id="wall-btn" type="button">Wall</button>
          <button id="update-btn" type="button">Update</button>
        </div>
      </div>
      <div id="toast"></div>
      <div id="hint">Tap Gunners or Soldiers. Circle a group. Tap a target.</div>
      <nav id="filters" class="side">
        <button type="button" data-filter="all" class="on" aria-label="All">
          <span class="unit-dot all" aria-hidden="true"></span>
        </button>
        <div class="filter-row">
          <button type="button" data-filter="gunner" class="filter-gunner" aria-label="Gunners">
            <span class="gunner-glyph" aria-hidden="true"><span class="gunner-body"></span><span class="gunner-barrel"></span></span>
          </button>
          <span class="filter-count" data-count="gunner">0</span>
        </div>
        <div class="filter-row">
          <button type="button" data-filter="troop" aria-label="Soldiers">
            <span class="unit-dot" aria-hidden="true"></span>
          </button>
          <span class="filter-count" data-count="troop">0</span>
        </div>
      </nav>
      <nav id="shop" class="bottom">
        <button id="defense-btn" type="button" disabled>
          <span class="shop-name">Gunner</span>
          <span class="shop-cost">6</span>
        </button>
      </nav>
    </div>
    <div id="error" class="hidden">
      <div class="error-card">
        <h2>Can't wall there</h2>
        <p id="error-text">You can't make walls through enemy bases.</p>
        <button id="error-ok" type="button">OK</button>
      </div>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="result"></h1>
      <div class="end-actions">
        <button id="restart-btn" type="button">Again</button>
        <button id="menu-btn" type="button">Menu</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
